name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy website
        run: |
          ssh -o StrictHostKeyChecking=no pancha@192.168.0.20 '
            cd /home/pancha/pancha.party &&
            git pull origin main &&
            rsync -av --delete public/ /var/lib/nginx/html/
          '